<!DOCTYPE html>
<html>
<head>
    <title>CreditCore Member Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #d4d0c8; margin: 0; padding: 0; }
        .titlebar { background: #003580; color: white; padding: 4px 8px; font-size: 12px; }
        .navbar { background: #ece9d8; border-bottom: 2px solid #003580; padding: 4px 12px; font-size: 12px; }
        .navbar a { margin-right: 16px; color: #003580; text-decoration: none; }
        .window { width: 520px; margin: 40px auto; background: #ece9d8; border: 2px solid #7a96df; }
        .window-title { background: linear-gradient(to right, #0a246a, #a6b5da); color: white; padding: 6px 10px; font-size: 13px; font-weight: bold; }
        .content { padding: 24px 32px; }
        h2 { font-size: 14px; color: #003580; border-bottom: 1px solid #999; padding-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 6px 4px; font-size: 13px; }
        input[type=text] { width: 180px; border: 1px solid #7f9db9; padding: 3px; font-size: 13px; }
        .btn { background: #ece9d8; border: 1px solid #7f9db9; padding: 4px 16px; font-size: 13px; cursor: pointer; }
        .error { color: red; font-size: 12px; margin-top: 8px; border: 1px solid red; padding: 6px; background: #fff0f0; }
        .hint { font-size: 11px; color: #666; margin-top: 16px; border-top: 1px solid #ccc; padding-top: 8px; }
    </style>
</head>
<body>
    <div class="titlebar">CreditCore Servicing Platform v4.2.1 - Internal Use Only</div>
    <div class="navbar"><a href="/search">Member Search</a><a href="/logout">Log Off</a></div>
    <div class="window">
        <div class="window-title">Member Search</div>
        <div class="content">
            <h2>Search by Member ID</h2>
            <form method="POST" action="/search">
                <table>
                    <tr><td>Member ID:</td><td><input type="text" name="member_id" id="member_id" /></td></tr>
                    <tr><td></td><td><input type="submit" class="btn" value="Search" /></td></tr>
                </table>
                {% if error %}<div class="error">{{ error }}</div>{% endif %}
            </form>
            <div class="hint">Valid test IDs: 12345, 67890 | Locked: 99999 | Not found: any other ID</div>
        </div>
    </div>
</body>
</html>
